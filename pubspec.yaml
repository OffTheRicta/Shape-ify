name: roundhound
version: 0.1.0+39
description: Phone-only star and ground-angle experiment with a message relay.
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.5.1
  camera: ^0.12.1
  geolocator: ^13.0.4
  sensors_plus: ^7.1.0
  share_plus: ^13.3.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/family_crest.png
    - assets/logo.png
