name: Shape-ify iOS Simulator

on:
  workflow_dispatch:
    inputs:
      mac_arch:
        description: Architecture reported by uname -m on rented Mac
        type: choice
        required: true
        default: arm64
        options:
          - arm64
          - x86_64

permissions:
  contents: read

jobs:
  build-simulator:
    runs-on: ${{ inputs.mac_arch == 'x86_64' && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Find and build Flutter project
        run: |
          set -euo pipefail
          echo "GitHub checkout: $GITHUB_WORKSPACE"
          project_file="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name pubspec.yaml -print -quit)"
          if [[ -z "$project_file" ]]; then
            echo "No pubspec.yaml was checked out. Check the branch and committed files."
            exit 1
          fi
          cd "$(dirname "$project_file")"
          echo "Building from: $PWD"
          flutter pub get
          flutter build ios --simulator --debug \
            --dart-define=SHAPEIFY_RELAY_URL=https://relay.roundhound.info
          test -d build/ios/iphonesimulator/Runner.app
          ditto -c -k --keepParent \
            build/ios/iphonesimulator/Runner.app \
            "$GITHUB_WORKSPACE/Shape-ify-simulator.zip"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: shapeify-simulator-${{ inputs.mac_arch }}
          path: Shape-ify-simulator.zip
          if-no-files-found: error
