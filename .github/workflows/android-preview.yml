name: Android preview APK
on:
  push:
    branches: [shapeify-apk-preview]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - run: flutter pub get
      - name: Build universal Android preview APK
        run: flutter build apk --debug --target-platform android-arm,android-arm64,android-x64
      - name: Verify Flutter engine architectures
        run: |
          unzip -Z1 build/app/outputs/flutter-apk/app-debug.apk > apk-entries.txt
          for abi in armeabi-v7a arm64-v8a x86_64; do
            grep -Fx "lib/$abi/libflutter.so" apk-entries.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Shape-ify-Android-preview
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
