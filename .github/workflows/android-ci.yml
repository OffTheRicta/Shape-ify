name: Shape-ify Android parity build

on:
  push:
    branches:
      - main
      - codex/android-parity-38
    paths:
      - .github/workflows/android-ci.yml
      - tools/configure_android.py
      - android/**
      - assets/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Prepare Android project
        run: |
          if [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org shapeify.roundhound --project-name roundhound .
          fi
          python3 tools/configure_android.py
          python3 -m pip install 'Pillow==11.3.0'
          python3 tools/generate_android_icons.py
      - name: Verify Dart and build installable APK
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug \
            --dart-define=SHAPEIFY_DEMO=false \
            --dart-define=SHAPEIFY_RELAY_URL=https://relay.roundhound.info
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Save Android project for source control
        run: |
          rm -rf android/.kotlin android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          tar -czf android-scaffold.tar.gz \
            --exclude=android/.gradle \
            --exclude=android/local.properties \
            --exclude=android/key.properties \
            android
      - name: Check in the verified Android host on the feature branch
        if: github.ref == 'refs/heads/codex/android-parity-38'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android
          git add -f android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar
          if ! git diff --cached --quiet; then
            git commit -m 'Check in verified Shape-ify Android project'
            git push origin HEAD:codex/android-parity-38
          fi
      - name: Upload APK and Android scaffold
        uses: actions/upload-artifact@v4
        with:
          name: shapeify-android-0.1.0+38-debug
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            android-scaffold.tar.gz
          if-no-files-found: error
