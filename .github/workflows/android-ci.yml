name: Shape-ify Android parity build

on:
  push:
    branches:
      - main
      - codex/android-parity-38
      - codex/original-android-parity
    paths:
      - .github/workflows/android-ci.yml
      - tools/configure_android.py
      - android/**
      - assets/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/android-ci.yml
      - tools/configure_android.py
      - android/**
      - assets/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Prepare Android project
        run: |
          if [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org shapeify.roundhound --project-name roundhound .
          fi
          python3 tools/configure_android.py
      - name: Verify Dart and build installable APK
        id: debug
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug \
            --dart-define=SHAPEIFY_DEMO=false \
            --dart-define=SHAPEIFY_RELAY_URL=https://relay.roundhound.info
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo "version=$(sed -n 's/^version: *//p' pubspec.yaml)" >> "$GITHUB_OUTPUT"
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shapeify-android-${{ steps.debug.outputs.version }}-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Build release packages for private local signing
        if: github.event_name != 'pull_request'
        run: |
          flutter build apk --release --dart-define=SHAPEIFY_DEMO=false --dart-define=SHAPEIFY_RELAY_URL=https://relay.roundhound.info
          flutter build appbundle --release --dart-define=SHAPEIFY_DEMO=false --dart-define=SHAPEIFY_RELAY_URL=https://relay.roundhound.info
      - name: Upload unsigned release packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: shapeify-android-${{ steps.debug.outputs.version }}-unsigned-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
