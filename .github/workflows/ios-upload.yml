# Upload a verified signed IPA; build completion uploads automatically.
name: Shape-ify iOS upload to TestFlight

on:
  workflow_run:
    workflows: [Shape-ify iOS signed IPA]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Number after /actions/runs/ in the successful signed IPA run URL'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Verify source build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Enter the numeric signed build run ID.' >&2; exit 1; }
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            | python3 -c '
          import json, sys
          run = json.load(sys.stdin)
          if run.get("conclusion") != "success" or run.get("head_branch") != "main" or run.get("name") != "Shape-ify iOS signed IPA":
              raise SystemExit("Choose a successful Shape-ify iOS signed IPA run from main.")
          print("Verified signed IPA run:", run["id"])
          '

      - name: Download signed IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: shapeify-ios-signed-ipa
          run-id: ${{ inputs.source_run_id || github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ipa

      - name: Install App Store Connect API key
        shell: bash
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [[ "$ASC_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo 'Check ASC_API_KEY_ID secret.' >&2; exit 1; }
          [[ "$ASC_API_ISSUER_ID" =~ ^[a-fA-F0-9-]{36}$ ]] || { echo 'Check ASC_API_ISSUER_ID secret.' >&2; exit 1; }
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          chmod 700 "$HOME/.appstoreconnect" "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          test -s "$key_path" || { echo 'Check ASC_API_PRIVATE_KEY_BASE64 secret.' >&2; exit 1; }

      - name: Upload signed IPA to App Store Connect
        shell: bash
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipa_files=(ipa/*.ipa)
          (( ${#ipa_files[@]} == 1 )) || { echo 'Expected exactly one signed IPA artifact.' >&2; exit 1; }
          xcrun altool --upload-app --type ios -f "${ipa_files[0]}" \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Remove temporary API key
        if: always()
        shell: bash
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          if [[ "$ASC_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          fi
